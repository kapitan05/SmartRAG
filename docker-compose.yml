services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  mongodb:
    image: mongo:latest
    container_name: mongo_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  docling:
    image: quay.io/docling-project/docling-serve:latest
    container_name: docling_service
    ports:
      - "5001:5001"
    environment:
      - DOCLING_SERVE_ENABLE_UI=1
      - DOCLING_SERVE_MAX_SYNC_WAIT=1800
    restart: unless-stopped

  api:
    build: .
    platform: linux/arm64
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - qdrant
      - mongodb
    volumes:
      - ./src:/app/src
      - ./sec-10K-filings:/app/sec-10K-filings
      - ./evaluation_data:/app/evaluation_data

  ui:
    build: .                
    ports:
      - "8501:8501"         
    env_file:
      - .env
    environment:
      - API_URL=http://api:8000/api
    command: ["uv", "run", "streamlit", "run", "src/ui/app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    depends_on:
      - api

  mlflow:
      image: ghcr.io/mlflow/mlflow:v2.12.1
      container_name: mlflow_server
      ports:
        - "5050:5000"
      command: >
        mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:///mlflow.db
        --default-artifact-root ./artifacts
      volumes:
        - ./mlflow_data:/mlflow
      working_dir: /mlflow

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin

volumes:
  qdrant_data:
  mongo_data:
  mlflow_data:
  prometheus_data: